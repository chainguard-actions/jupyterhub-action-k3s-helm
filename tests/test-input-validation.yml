name: Test input validation - both k3s-version and k3s-channel specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with both k3s-version and k3s-channel (should fail)
        id: action
        uses: .
        with:
          k3s-version: "v1.28.0+k3s1"
          k3s-channel: "stable"
        continue-on-error: true

      - name: Assert action failed due to invalid input combination
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when both k3s-version and k3s-channel were specified"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail but it succeeded — validation logic may be broken"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
