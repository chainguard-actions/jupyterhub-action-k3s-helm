name: Test input validation - both k3s-version and k3s-channel fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install yq (mikefarah/yq v4) required by action for calico setup
        run: |
          set -e
          YQ_VERSION="v4.44.3"
          echo "Installing yq ${YQ_VERSION}..."
          sudo curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version
          echo "yq installed successfully"

      - name: Run action with both k3s-version and k3s-channel (should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          k3s-version: "v1.28.0+k3s1"
          k3s-channel: "stable"

      - name: Assert action failed due to invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both k3s-version and k3s-channel are set, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with both k3s-version and k3s-channel set"
