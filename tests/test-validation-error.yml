name: Test validation error (k3s-version and k3s-channel both set)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action should fail when both k3s-version and k3s-channel are set.
      # We use continue-on-error to capture the failure and assert it happened.
      - id: action
        uses: .
        continue-on-error: true
        with:
          k3s-version: "v1.28.0+k3s1"
          k3s-channel: "stable"

      - name: Assert action failed due to validation error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both k3s-version and k3s-channel are set, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when both k3s-version and k3s-channel were specified"
